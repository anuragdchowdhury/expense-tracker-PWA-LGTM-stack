services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: money-tracker-frontend
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - money-tracker-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: money-tracker-backend
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/database.db
      - CURRENCY=${CURRENCY:-INR}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-money-tracker-backend}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    depends_on:
      - otel-collector
    restart: unless-stopped
    networks:
      - money-tracker-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: money-tracker-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "8888"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - money-tracker-net

  prometheus:
    image: prom/prometheus:latest
    container_name: money-tracker-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
      - "--web.enable-otlp-receiver"
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    restart: unless-stopped
    networks:
      - money-tracker-net

  loki:
    image: grafana/loki:latest
    container_name: money-tracker-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
      - "9096"
    restart: unless-stopped
    networks:
      - money-tracker-net

  tempo:
    image: grafana/tempo:latest
    container_name: money-tracker-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    restart: unless-stopped
    networks:
      - money-tracker-net

  grafana:
    image: grafana/grafana:latest
    container_name: money-tracker-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_AUTH_ANONYMOUS_ENABLED:-true}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GF_AUTH_ANONYMOUS_ORG_ROLE:-Admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - money-tracker-net

volumes:
  backend-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  money-tracker-net:
    driver: bridge

